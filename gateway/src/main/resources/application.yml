spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthenticationFilter
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuthenticationFilter

server:
  port: 8085

jwt:
  secret: "your-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-change-this"
